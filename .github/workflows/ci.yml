# Workflow de Integração Contínua focado em testes unitários
# Estrutura simples e preparada para expansão futura (ex: adicionar lint, e2e, build, etc.)

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # Configura a versão do Node.js definida na variável global
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências usando yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Executa os testes unitários com Vitest
      - name: Run unit tests
        run: yarn test
