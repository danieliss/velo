# Workflow de Integração Contínua focado em testes unitários
# Evita execução de testes E2E (Playwright) e mantém estrutura pronta para expansão

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: danieliss-projects

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configura a versão do Node.js definida na variável global
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências usando yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Executa apenas testes unitários (ignora Playwright E2E)
      - name: Run unit tests
        run: yarn test -- --exclude=playwright

  build-and-deploy:
    name: Build and Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest

    steps:
      # Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configura a versão do Node.js definida na variável global
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências usando yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Build para o Vercel
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # Deploy Preview Vercel
      - name: Deploy Vercel preview
        run: yarn vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE