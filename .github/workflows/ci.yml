# Workflow de Integração Contínua focado em testes unitários
# Evita execução de testes E2E (Playwright) e mantém estrutura pronta para expansão

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configura a versão do Node.js definida na variável global
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências usando yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Executa apenas testes unitários (ignora pasta playwright)
      - name: Run unit tests
        run: yarn test -- --exclude=playwright
