name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: danieliss-projects
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn test -- --exclude=playwright

  build-and-deploy:
    name: Build and Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest

    outputs:
      deployment-url: ${{ steps.deploy_preview.outputs.deployment_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: corepack enable
      - run: yarn install --frozen-lockfile

      - run: sudo apt-get update && sudo apt-get install -y jq

      - run: npx vercel link --yes --project $VERCEL_PROJECT_ID --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE
      - run: npx vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE
      - run: npx vercel build --token=$VERCEL_TOKEN

      - name: Deploy Vercel preview
        id: deploy_preview
        run: |
          result=$(npx vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE --json)
          url=$(echo $result | jq -r '.url')
          if [[ $url == http* ]]; then
            final_url=$url
          else
            final_url="https://$url"
          fi
          echo "deployment_url=$final_url" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run E2E Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: corepack enable
      - run: yarn install

      - run: yarn playwright install --with-deps chromium

      - name: Debug URL
        run: echo "URL=${{ needs.build-and-deploy.outputs.deployment-url }}"

      - name: Wait for app to be ready
        run: |
          URL=${{ needs.build-and-deploy.outputs.deployment-url }}

          echo "Testing URL: $URL"

          for i in {1..30}; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" $URL || true)

            echo "Attempt $i - Status: $STATUS"

            if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ]; then
              echo "App is up!"
              exit 0
            fi

            sleep 5
          done

          echo "App did not become ready in time"
          exit 1

      - name: Seed database
        run: yarn seed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run E2E Regression Tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Publish Testdino Report
        if: ${{ !cancelled() }}
        run: npx tdpw upload ./playwright-report --token=${{ secrets.TD_TOKEN }}

  deploy-production:
    name: Deploy Production
    needs: [e2e-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: corepack enable
      - run: yarn install --frozen-lockfile

      - run: npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
      - run: npx vercel build --prod --token=$VERCEL_TOKEN
      - run: npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE